<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Főzzünk!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F6;--card:#FFFFFF;--rim:#1D4E89;--rim2:#DCE6F2;--ink:#18222D;--mute:#5A6672;--pap:#C42A26;--pea:#4A7A26;--line:#E1E6EA;--onrim:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1821;--card:#16222F;--rim:#6E9DDA;--rim2:#21354B;--ink:#E7EDF3;--mute:#9BA9B6;--pap:#FF7A6B;--pea:#93C46A;--line:#27384B;--onrim:#0F1821;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:28px;font-weight:800}h2{font-size:21px;font-weight:700}h3{font-size:17px;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 13px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rim)}
button:focus-visible{outline:3px solid var(--rim);outline-offset:2px}
#app{min-height:100%}
.top{position:sticky;top:0;z-index:5;background:var(--rim);color:var(--onrim);padding:14px 18px 16px;
 background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.6px),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.6px);background-size:11px 11px,17px 17px;background-position:0 0,5px 7px;
 border-radius:0 0 26px 26px;display:flex;align-items:center;gap:10px}
.top .brand{font-size:24px;font-weight:800;flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.16)}
main{padding:18px 16px 110px;max-width:640px;margin:0 auto}
.sec{margin:0 0 26px}
.sec>h2{margin-bottom:10px}
.hint{color:var(--mute);font-size:14px;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--rim);color:var(--onrim);font-weight:700}
.btn.ghost{background:var(--rim2);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.chip.on{border-color:var(--rim);background:var(--rim);color:var(--onrim)}
.dish{display:block;width:100%;text-align:left;background:var(--card);border:3px solid var(--rim);border-radius:24px;overflow:hidden;margin:0 0 14px}
.ph{aspect-ratio:16/9;background:var(--rim2);display:grid;place-items:center;font-size:42px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.dish .body{padding:12px 15px 14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin-top:4px}
.kcal{color:var(--pap);font-weight:700}
.why{font-size:14px;margin-top:6px}
.tags{font-size:13px;margin-top:6px;color:var(--mute)}
.tags b{color:var(--pea)}.tags i{font-style:normal;color:var(--pap)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:15px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.x{width:34px;height:34px;border-radius:50%;color:var(--mute);font-size:18px}
.tag{font-size:12px;font-weight:700;color:var(--pap);border:1.5px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap}
.chk{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--rim);display:grid;place-items:center;flex:none;font-weight:800;color:var(--onrim)}
.chk.on{background:var(--rim)}
.done .grow{text-decoration:line-through;color:var(--mute)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);padding:6px 0;border-radius:16px}
.nav button span{font-size:21px;line-height:1.1}
.nav button.on{color:var(--rim);background:var(--rim2)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumb{position:relative;flex:none;width:92px;height:92px;border-radius:16px;overflow:hidden;border:2px solid var(--rim)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.loading{display:flex;align-items:center;gap:12px;color:var(--mute);padding:18px 4px}
.pot{width:28px;height:28px;border-radius:50%;border:4px solid var(--rim2);border-top-color:var(--rim);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pot{animation:none}}
.toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:50;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:16px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
/* recipe */
.rtop{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:12px 14px;background:linear-gradient(var(--bg),transparent)}
.rtop .iconbtn{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.hero{margin:0 16px;border:3px solid var(--rim);border-radius:26px;overflow:hidden}
.credit{font-size:12px;color:var(--mute);padding:6px 20px 0}
.credit a{color:inherit}
.rhead{padding:14px 18px 0}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.macros div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;font-size:12px;color:var(--mute)}
.macros b{display:block;font-size:18px;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.macros div:first-child b{color:var(--pap)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--rim2);font-size:22px;font-weight:700}
.stepper b{min-width:60px;text-align:center}
.ing .q{font-weight:700;white-space:nowrap}
.have{color:var(--pea);font-weight:800}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin:0 0 10px;padding-left:4px}
.dog{border-color:var(--pea)}
.dog h3{color:var(--pea)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.foot .btn{flex:1}
/* cook */
.cook{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.cook .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--rim);color:var(--onrim)}
.cook .stage{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--rim2)}
.progress i.on{background:var(--rim)}
.steptext{font-size:25px;line-height:1.4;font-weight:500}
.timer{border:3px solid var(--rim);border-radius:24px;padding:16px;text-align:center;background:var(--card)}
.timer .t{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.end .t{color:var(--pap)}
.cook .ctrl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.cook .ctrl .btn{min-height:58px}
.speak{width:58px;height:58px;border-radius:50%;background:var(--rim2);font-size:24px}
.rate{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rate .opts{display:flex;gap:6px}
.rate .opts button{width:48px;height:48px;border-radius:50%;font-size:24px;background:var(--rim2);opacity:.55}
.rate .opts button.on{opacity:1;outline:3px solid var(--rim)}
/* camera */
.cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;min-height:0}
.cam .cbar{display:flex;align-items:center;justify-content:space-around;padding:18px 0 calc(22px + env(safe-area-inset-bottom,0px))}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.4);background-clip:padding-box}
.cam .cbar .iconbtn{color:#fff}
.field{margin:0 0 14px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:22px;height:22px}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.empty b{display:block;font-size:36px;margin-bottom:6px}
.log .d{font-size:13px;color:var(--mute);min-width:64px}
.small{font-size:13px;color:var(--mute)}
a{color:var(--rim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;min-height:96px}
.tile .te{font-size:28px;line-height:1.2}
.tile b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:16px;line-height:1.2}
.tile.add{border-style:dashed;color:var(--mute)}
.mback{position:fixed;inset:0;z-index:60;background:rgba(10,18,26,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.mbox{width:100%;max-width:480px;background:var(--card);color:var(--ink);border:3px solid var(--rim);border-radius:26px;padding:20px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mbox h3{font-size:20px;margin-bottom:6px}.mbox p{margin:0 0 12px;color:var(--mute)}
.mbox input{margin:4px 0 14px}
.mbtns{display:flex;gap:10px}.mbtns .btn{flex:1}
.btn.danger{background:var(--pap);color:#fff}
.framegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.frame{padding:0;border:3px solid transparent;border-radius:14px;overflow:hidden;aspect-ratio:9/16;background:var(--rim2)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.on{border-color:var(--rim)}
.cropvp{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:3px solid var(--rim);border-radius:24px;background:#1b2733;touch-action:none;user-select:none;-webkit-user-select:none}
.cropvp .cbg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) brightness(.85)}
.cropvp .cimg{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.cropvp .cgrid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%),linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%)}
.ph.thumbph{width:58px;height:58px;aspect-ratio:auto;flex:none;border-radius:14px;font-size:24px}
.setup{padding:0 18px 40px;max-width:640px;margin:0 auto}
.setup .hero2{background:var(--rim);color:var(--onrim);margin:0 -18px 22px;padding:40px 22px 30px;border-radius:0 0 32px 32px;
 background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.6px),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.6px);background-size:11px 11px,17px 17px;background-position:0 0,5px 7px}
.setup .hero2 h1{font-size:40px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="modal" style="display:none"></div>
<script>
"use strict";
var APP_VER = "1.8.3";
var DEFAULT_UPD = "https://raw.githubusercontent.com/patrikpusoma/Apps/main/fozzunk.html";
var NATIVE = typeof window.AndroidBridge !== "undefined";
var LS = "fozzunk-v1";
var API = "https://api.openai.com/v1/chat/completions";
var DAYS = ["vasárnap","hétfő","kedd","szerda","csütörtök","péntek","szombat"];

function defState(){return {setup:false,openaiKey:"",pexelsKey:"",household:2,people:"",avoid:"",dogs:true,readAloud:true,
 log:[],recipes:{},pantry:[],shop:[],plan:null,sugg:null,fsugg:null,img:{},own:{},mode:"any"};}
var S = (function(){try{var o=JSON.parse(localStorage.getItem(LS)||"null");if(o)return Object.assign(defState(),o);}catch(e){}return defState();})();
Object.keys(S.img).forEach(function(k){if(!S.img[k].px)delete S.img[k];});
if(S.updUrl&&/\/patrikpusoma\/beszelj\//i.test(S.updUrl))S.updUrl=S.updUrl.replace(/\/patrikpusoma\/beszelj\//i,"/patrikpusoma/Apps/");
if(!S.folders) S.folders=[["edes","🥞","Édes reggeli"],["sos","🍳","Sós reggeli"],["leves","🍲","Levesek"],["fo","🍖","Főételek"],["teszta","🍝","Tészták"],["salata","🥗","Saláták, könnyű ételek"],["suti","🍰","Sütik, desszertek"]].map(function(a){return {id:a[0],e:a[1],n:a[2]};});
function folderById(id){for(var i=0;i<S.folders.length;i++)if(S.folders[i].id===id)return S.folders[i];return null;}
function folderByName(n){var x=norm(n);if(!x)return null;for(var i=0;i<S.folders.length;i++){var f=norm(S.folders[i].n);if(f===x||f.indexOf(x)>=0||x.indexOf(f)>=0)return S.folders[i];}return null;}
function folderNames(){return S.folders.map(function(f){return f.n;}).join("|");}
function recFolders(r){return (r.folders||[]).filter(function(id){return folderById(id);});}
function setFolderFromAI(r,name,prev){if(prev&&prev.length){r.folders=prev;return;}var f=folderByName(name);r.folders=f?[f.id]:[];}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast("Nem sikerült menteni: megtelt a tárhely. Törölj régi recepteket.");}}

var tab="home", stack=[], busy={}, fridgePhotos=[], app=document.getElementById("app");
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,10);}
function dstr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function keyOf(name){return norm(name).replace(/[^a-z0-9]+/g,"-");}
function people(){return S.people.split(/[,;\n]/).map(function(x){return x.trim();}).filter(Boolean);}

var dialogClose=null;
function dialog(o){return new Promise(function(res){
 var m=document.getElementById("modal"),hasIn=o.input!=null;
 m.innerHTML='<div class="mback"><div class="mbox" role="dialog" aria-modal="true"><h3>'+esc(o.title)+"</h3>"+(o.text?"<p>"+esc(o.text)+"</p>":"")+
  (hasIn?'<input id="minp" value="'+esc(o.input)+'" placeholder="'+esc(o.ph||"")+'" enterkeyhint="done">':"")+
  '<div class="mbtns"><button class="btn ghost" data-m="0">Mégse</button><button class="btn'+(o.danger?" danger":"")+'" data-m="1">'+esc(o.ok||"OK")+"</button></div></div></div>";
 m.style.display="block";
 var inp=document.getElementById("minp");if(inp)setTimeout(function(){inp.focus();},50);
 function close(ok){m.style.display="none";m.innerHTML="";m.onclick=null;dialogClose=null;res(hasIn?(ok?inp.value.trim():null):!!ok);}
 dialogClose=function(){close(false);};
 m.onclick=function(e){e.stopPropagation();var b=e.target.closest("[data-m]");if(b)close(b.getAttribute("data-m")==="1");else if(e.target.classList.contains("mback"))close(false);};
 if(inp)inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();close(true);}};
});}
var toastT;
function toast(msg,ms){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},ms||3200);}

/* ---------- HTTP ---------- */
var pending={};
window.__httpDone=function(id,status,body,url){var p=pending[id];if(p){delete pending[id];p({status:status,body:body,url:url||""});}};
function http(method,url,headers,body){
 if(NATIVE) return new Promise(function(res){var id=uid();pending[id]=res;AndroidBridge.http(id,method,url,JSON.stringify(headers||{}),body||"");});
 return fetch(url,{method:method,headers:headers,body:body||undefined}).then(function(r){return r.text().then(function(t){return {status:r.status,body:t};});}).catch(function(){return {status:0,body:""};});
}

/* ---------- AI ---------- */
var SYS="Egy magyar családi főzős app asszisztense vagy. Magyarul válaszolsz, mindig egyetlen érvényes JSON objektummal, semmi mással. A kalóriabecsléseid reálisak, egy adagra vonatkoznak.";
async function ask(prompt,images){
 if(!S.openaiKey) throw {code:"no_key"};
 var content=(images&&images.length)?[{type:"text",text:prompt}].concat(images.map(function(u){return {type:"image_url",image_url:{url:u}};})):prompt;
 var msgs=[{role:"system",content:SYS},{role:"user",content:content}];
 var h={"Content-Type":"application/json","Authorization":"Bearer "+S.openaiKey};
 var r=await http("POST",API,h,JSON.stringify({model:"gpt-4.1-mini",messages:msgs,response_format:{type:"json_object"},max_tokens:3500,temperature:0.8}));
 if(r.status===404||(r.status===400&&/model/i.test(r.body))){
  r=await http("POST",API,h,JSON.stringify({model:"gpt-5-mini",messages:msgs,response_format:{type:"json_object"},max_completion_tokens:7000,reasoning_effort:"minimal"}));
 }
 if(r.status===0) throw {code:"network"};
 if(r.status===401||r.status===403) throw {code:"bad_key"};
 if(r.status===429) throw {code:/insufficient_quota/.test(r.body)?"no_credit":"rate"};
 if(r.status>=400) throw {code:"api"};
 var d=JSON.parse(r.body);
 var t=String((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").replace(/```json|```/g,"").trim();
 var a=t.indexOf("{"),b=t.lastIndexOf("}");
 if(a<0||b<a) throw {code:"json"};
 return JSON.parse(t.slice(a,b+1));
}
function aiErr(e){
 var c=e&&e.code;
 toast(c==="no_key"?"Add meg az OpenAI API-kulcsot a ⚙️ Beállításokban.":c==="bad_key"?"Érvénytelen OpenAI API-kulcs. Ellenőrizd a ⚙️ Beállításokban.":c==="no_credit"?"Elfogyott az OpenAI egyenleged. Tölts fel a platform.openai.com oldalon.":c==="rate"?"Túl sok kérés. Várj egy percet, és próbáld újra.":c==="network"?"Nincs internetkapcsolat. Ellenőrizd a netet, és próbáld újra.":"Az AI most nem adott használható választ. Próbáld újra.",5000);
}

function profile(){
 var m={};
 S.log.forEach(function(e){var k=norm(e.name);if(!m[k])m[k]={name:e.name,n:0,s:0};m[k].n++;m[k].s+=(e.rating||0);});
 var arr=Object.keys(m).map(function(k){return m[k];});
 var liked=arr.filter(function(x){return x.s>=0;}).sort(function(a,b){return (b.n+b.s*2)-(a.n+a.s*2);}).slice(0,18).map(function(x){return x.name;});
 var bad=arr.filter(function(x){return x.s<0;}).map(function(x){return x.name;});
 var recent=S.log.filter(function(e){return e.date&&(Date.now()-new Date(e.date).getTime())<10*864e5;}).map(function(e){return e.name;});
 var p="Háztartás: "+S.household+" fő"+(people().length?" ("+people().join(", ")+")":"")+".";
 if(S.avoid.trim()) p+=" Amit nem esznek / allergia: "+S.avoid.trim()+".";
 if(liked.length) p+=" Szokásos, kedvelt ételeik: "+liked.join(", ")+".";

function cropInit(){
 var top=stack[stack.length-1],vp=document.getElementById("cvp"),img=document.getElementById("cimg");if(!top||top.t!=="crop"||!vp||!img)return;

  if(!C.w||!C.h)return;
  C.cover=Math.max(C.W/C.w,C.H/C.h);C.min=Math.min(C.W/C.w,C.H/C.h);C.max=C.cover*4;
  if(top.st){C.s=top.st.s;C.x=top.st.x;C.y=top.st.y;}else cropReset();

  vp.onpointermove=function(e){if(!C.pts[e.pointerId])return;var prev=C.pts[e.pointerId];C.pts[e.pointerId]={x:e.clientX,y:e.clientY};
   var ids=Object.keys(C.pts);
   if(ids.length===1){C.x+=e.clientX-prev.x;C.y+=e.clientY-prev.y;}
   else if(ids.length>=2){var a=C.pts[ids[0]],b2=C.pts[ids[1]];var d=Math.hypot(a.x-b2.x,a.y-b2.y),mx=(a.x+b2.x)/2-C.vp.getBoundingClientRect().left,my=(a.y+b2.y)/2-C.vp.getBoundingClientRect().top;
    if(C.last){cropZoomAt(C.s*d/C.last.d,mx,my);C.x+=mx-C.last.mx;C.y+=my-C.last.my;}C.last={d:d,mx:mx,my:my};}
   cropApply();};
  var up=function(e){delete C.pts[e.pointerId];C.last=null;};
  vp.onpointerup=up;vp.onpointercancel=up;

function cropZoomAt(ns,px,py){ns=Math.max(C.min,Math.min(C.max,ns));var f=ns/C.s;C.x=px-(px-C.x)*f;C.y=py-(py-C.y)*f;C.s=ns;}

 C.x=iw>=C.W?Math.min(0,Math.max(C.W-iw,C.x)):Math.max(0,Math.min(C.W-iw,C.x));
 C.y=ih>=C.H?Math.min(0,Math.max(C.H-ih,C.y)):Math.max(0,Math.min(C.H-ih,C.y));
 C.img.style.width=C.w+"px";C.img.style.height=C.h+"px";
 C.img.style.transform="translate("+C.x+"px,"+C.y+"px) scale("+C.s+")";
 C.top.st={s:C.s,x:C.x,y:C.y};

var timer=null,tick=null;
function fmtT(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function timerLeft(){if(!timer)return 0;return timer.run?(timer.end-Date.now())/1000:timer.left;}
function startTick(){clearInterval(tick);tick=setInterval(function(){if(!timer)return;var l=timerLeft();var el=$("#tdisp");if(el)el.textContent=fmtT(l);
 if(timer.run&&l<=0){timer.run=false;timer.left=0;timer.done=true;clearInterval(tick);ring();render();}},300);}
function ring(){if(NATIVE)AndroidBridge.vibrate(1200);else if(navigator.vibrate)navigator.vibrate([400,200,400]);
 try{var ac=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.3);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.3);});}catch(e){}
 speak("Lejárt az időzítő.");toast("⏰ Lejárt az időzítő!",6000);}

function fmtQ(q,servBase,serv,unit){
 if(q==null||q==="") return "";
 var v=Number(q)*serv/servBase;if(!isFinite(v)) return String(q);
 if(v>=100&&/^(g|ml)$/.test(unit)) v=Math.round(v/10)*10;
 else if(v>=10) v=Math.round(v);
 else if(/^(db|gerezd|csokor)$/.test(unit)) v=Math.max(0.5,Math.round(v*2)/2);
 else v=Math.round(v*10)/10;
 return String(v).replace(".",",");
}

 case "imgPix": var rp=S.recipes[top.k];stack.pop();render();toast("Keresek egy képet a Pixabayen…");stockPhoto(rp.name,rp.nameEn,true).then(function(p){if(p)render();else toast("Nem találtam képet a Pixabayen.");});break;
 case "pickF": top.f=el.getAttribute("data-id")||"";render();break;
 case "fOpen": stack.push({t:"folder",id:el.getAttribute("data-id")});render();scrollTop();break;
 case "fNew": newFolder(top&&top.t==="rfold"?function(f){var rr=S.recipes[top.k];rr.folders=recFolders(rr).concat([f.id]);save();}:null);break;
 case "fRename": var fr=folderById(el.getAttribute("data-id")||top.id);dialog({title:"Mappa átnevezése",input:fr.e+" "+fr.n,ok:"Mentés"}).then(function(nn){if(!nn)return;var mm=nn.match(/^(\p{Extended_Pictographic}[\uFE0F\u200D\p{Extended_Pictographic}]*)\s*(.*)$/u);if(mm&&mm[2]){fr.e=mm[1];fr.n=mm[2];}else fr.n=nn;save();render();});break;
 case "fDelete": var fd=folderById(el.getAttribute("data-id")||top.id),inView=!el.getAttribute("data-id");dialog({title:"Mappa törlése",text:"Törlöd a(z) „"+fd.n+"” mappát? A benne lévő receptek megmaradnak.",ok:"Törlés",danger:true}).then(function(ok){if(!ok)return;S.folders=S.folders.filter(function(f){return f.id!==fd.id;});Object.keys(S.recipes).forEach(function(k){var rr=S.recipes[k];if(rr.folders)rr.folders=rr.folders.filter(function(x){return x!==fd.id;});});save();if(inView)stack.pop();render();toast("Mappa törölve.");});break;
 case "fEdit": window._fedit=!window._fedit;render();break;
 case "rDel": deleteRecipe(el.getAttribute("data-k")||top.k);break;
 case "rFold": stack.push({t:"rfold",k:top.k});render();scrollTop();break;
 case "fToggle": var rt=S.recipes[top.k],fid2=el.getAttribute("data-id"),curF=recFolders(rt);rt.folders=curF.indexOf(fid2)>=0?curF.filter(function(x){return x!==fid2;}):curF.concat([fid2]);save();render();break;
 case "autoSort": autoSort();break;
 case "impOpen": stack.push({t:"import",url:"",text:"",shots:[],frames:[],err:""});render();scrollTop();break;
 case "impShots": var ti2=top;pickFiles(true,function(u){ti2.shots=ti2.shots.concat(u).slice(0,6);render();},1600);break;
 case "impVideo": var tv=top;tv.stage="Kiolvasom a képkockákat a videóból…";busy.imp=true;render();
  framesVia(function(id){AndroidBridge.pickVideo(id);}).then(function(fr){busy.imp=false;if(fr){tv.frames=fr;toast(fr.length+" képkockát olvastam ki. Nyomd meg a Recept készítése gombot.");}render();});break;
 case "impFramesRm": top.frames=[];render();break;
 case "impRm": top.shots.splice(+el.getAttribute("data-i"),1);render();break;
 case "impGo": if(!busy.imp)importVideo(top);break;
 case "cropOpen": cropOpen(top.k);break;
 case "cropReset": cropReset();cropApply();break;
 case "cropSave": cropSave();break;
 case "updCheck": checkUpdate(true);break;
 case "updReset": dialog({title:"Vissza a telepített verzióra",text:"Törlöm a letöltött frissítéseket, és a telepített verzió indul. Az adataid megmaradnak.",ok:"Visszaállítás"}).then(function(ok){if(ok)AndroidBridge.resetToBuiltin();});break;
 case "camClose": closeCamera();break;
 case "snap": snap();break;
 }
});
document.addEventListener("input",function(ev){if(ev.target.id==="czoom"){cropSlider(+ev.target.value);return;}if(ev.target.id==="bq"){window._bq=ev.target.value;render();}else if(ev.target.id==="iu"||ev.target.id==="it"){var ti=stack[stack.length-1];if(ti&&ti.t==="import"){if(ev.target.id==="iu")ti.url=ev.target.value;else ti.text=ev.target.value;}}
 else if(ev.target.id==="pq"){var t=stack[stack.length-1];if(t&&t.t==="pick"){t.q=ev.target.value;render();}}});
document.addEventListener("keydown",function(ev){if(ev.key!=="Enter")return;var m={logIn:"logAdd",pIn:"addPantry",sIn:"addShop",pq:"pickFree"}[ev.target.id];if(m){var b=document.querySelector('[data-act="'+m+'"]');if(b)b.click();}});

function goBack(){
 var top=stack[stack.length-1];
 if(!top){if(tab!=="home"){tab="home";render();return true;}return false;}
 if(top.t==="camera"){closeCamera();return true;}
 if(top.t==="cook")stopSpeak();
 stack.pop();render();return true;
}
window.onAndroidBack=function(){if(dialogClose){dialogClose();return true;}if(!S.setup)return false;return goBack();};
render();
setTimeout(function(){window.checkShared();},300);
if(S.setup&&S.lastVer!==APP_VER)setTimeout(function(){toast("✨ Az app frissült: "+APP_VER,6000);},600);
if(S.lastVer!==APP_VER){S.lastVer=APP_VER;save();}
if(NATIVE){try{AndroidBridge.bootOk();}catch(e){}
 var ui0=updInfo();if(ui0.rolledBack)setTimeout(function(){toast("A(z) "+ui0.rolledBack+" frissítés nem indult el rendesen, visszaálltam az előző verzióra.",7000);},800);
 if(!S.updAt||Date.now()-S.updAt>3*3600e3)setTimeout(function(){checkUpdate(false);},4000);}
</script>
